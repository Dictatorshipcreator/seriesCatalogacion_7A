<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tu espacio para organizar series, plataformas y valoraciones."
    />
    <meta name="theme-color" content="#11120f" />
    <title>Plano — Tu archivo de series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="Plano, inicio" data-view="overview">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span>plano<span class="brand-period">.</span></span>
        </a>

        <div class="sidebar-label">TU ESPACIO</div>
        <nav class="main-nav" aria-label="Navegación principal">
          <button class="nav-link active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            <span>Resumen</span>
          </button>
          <button class="nav-link" type="button" data-view="series">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m8 4.5 4 15m1-15 4 15"/></svg>
            <span>Mis series</span>
            <span class="nav-count" id="nav-series-count">0</span>
          </button>
          <button class="nav-link" type="button" data-view="platforms">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/></svg>
            <span>Plataformas</span>
            <span class="nav-count" id="nav-platforms-count">0</span>
          </button>
          <button class="nav-link" type="button" data-view="ratings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            <span>Valoraciones</span>
            <span class="nav-count" id="nav-ratings-count">0</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="storage-card">
            <span class="storage-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 12 3l8 3.5-8 3.5-8-3.5Z"/><path d="M4 11.5 12 15l8-3.5M4 16.5 12 20l8-3.5"/></svg></span>
            <span><strong>Tu colección</strong><small>Guardada en este dispositivo</small></span>
            <span class="storage-dot"></span>
          </div>
          <div class="profile">
            <span class="avatar">P</span>
            <span class="profile-copy"><strong>Mi espacio</strong><small>Colección personal</small></span>
            <span class="profile-more">···</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" type="button" id="menu-button" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="breadcrumb"><span>Mi espacio</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Resumen</strong></div>
          <div class="topbar-right">
            <span class="saved-indicator"><span></span> Guardado</span>
            <span class="topbar-divider"></span>
            <span class="topbar-avatar">P</span>
          </div>
        </header>

        <div class="page-container">
          <div class="notice notice-error" id="error-notice" role="alert" hidden></div>
          <div id="view-root"></div>
          <footer class="footer"><span>Hecho para disfrutar una serie más.</span><span>PLANO <span class="footer-period">•</span> TU ARCHIVO PERSONAL</span></footer>
        </div>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div><span class="modal-kicker" id="modal-kicker">TU COLECCIÓN</span><h2 id="modal-title">Nuevo registro</h2></div>
          <button class="icon-button modal-close" type="button" id="modal-close" aria-label="Cerrar">×</button>
        </div>
        <form id="record-form">
          <div class="modal-body" id="modal-fields"></div>
          <div class="modal-footer">
            <button class="button button-quiet" type="button" id="modal-cancel">Cancelar</button>
            <button class="button button-primary" type="submit" id="modal-submit">Guardar</button>
          </div>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
